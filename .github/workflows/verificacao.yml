# Roda em todo PR e em todo push na main: lint, tipos e build.
#
# Existe porque o Dependabot abre PRs sozinho, e sem isto eles entravam sem
# nenhuma checagem — a Vercel só constrói, não roda lint nem tsc. Se este
# workflow falhar, o PR não está pronto para entrar.
#
# O build roda SEM as chaves do Supabase de propósito: o site tem de construir
# assim (as seções que dependem do banco se escondem). Um build que só passa
# com segredo de produção é um build que quebra no primeiro projeto novo.
name: Verificação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Cookie Secure, CSP presa ao host do Supabase e cabeçalhos do next.config.
      # Roda cedo: não usa rede, não sobe servidor e leva menos de um segundo.
      - name: Segurança em código (cookie, CSP, cabeçalhos)
        run: npm run test:seguranca

      - name: Lint
        run: npm run lint

      - name: Regras puras (navegação, hoje, calendário, documentos, inventário)
        run: |
          npm run test:nav
          npm run test:hoje
          npm run test:calendario
          npm run test:documentos
          npm run test:inventario

      # Aplica supabase/001…NNN num Postgres em memória e ataca o resultado com
      # os papéis reais (anon, authenticated, supabase_auth_admin). É o que pega
      # uma migração que não aplica, ou que reabre o que outra fechou, ANTES de
      # alguém rodá-la à mão no SQL Editor de produção. Não usa rede nem segredo.
      - name: Banco (migrações, RLS e gatilhos)
        run: npm run test:banco

      # next-env.d.ts (tipos de import de imagem) e os tipos de rota são gerados
      # pelo Next e ficam fora do git. Sem gerar antes, o tsc não reconhece o
      # `import logo from "@/public/….png"` e falha num checkout limpo.
      - name: Tipos
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
